
name: Server Build and Tests

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:
  server-tests:
    name: Build and Test Server
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: Server/MultiplayerGameServer

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and run tests
        run: mvn -B clean verify

      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action@v2
        if: (!cancelled())
        with:
          files: Server/MultiplayerGameServer/target/surefire-reports/TEST-*.xml
          check_name: Server Test Results
